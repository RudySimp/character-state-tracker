name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify tag matches module version
        run: test "v$(node -p "require('./module.json').version")" = "$GITHUB_REF_NAME"
      - name: Run tests
        run: npm test
      - name: Validate release contents
        run: npm run validate
      - name: Build deterministic release
        run: npm run build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Character State Tracker 1.0.0" --notes-file RELEASE_NOTES_1.0.0.md dist/character-state-tracker.zip dist/module.json dist/SHA256SUMS.txt
